<!doctype html>
<html><head><meta charset="utf-8"><title>Hero render</title>
<script type="importmap">{ "imports": { "three": "/www/js/vendor/three/three.module.min.js", "three/addons/": "/www/js/vendor/three/addons/" } }</script>
<style>body{margin:0;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;font:12px system-ui}img{margin:6px;border:1px solid #aaa}#log{position:fixed;right:6px;top:6px;background:#fff;padding:4px 8px}</style>
</head><body><div id="log">starting</div><div id="out"></div>
<script type="module">
// Renders the two fan-made models (see models.txt) into transparent pictures and saves them as www/img/hero/<name>.webp.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const SHOTS = [
  // name, model, size in px, camera yaw/pitch (degrees), model roll (degrees)
  { name: 'hammer', model: 'hammer', w: 256, h: 256, yaw: 90, pitch: 10, roll: 0 },
  { name: 'reactor', model: 'reactor', w: 160, h: 160, yaw: 0, pitch: 0, roll: 0 },
];
const log = (s) => (document.getElementById('log').textContent = s);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
const loader = new GLTFLoader();
const cache = {};
for (const s of SHOTS) {
  log(s.name);
  const gltf = cache[s.model] || (cache[s.model] = await loader.loadAsync(`/tools/hero/models/${s.model}.glb`));
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 5); scene.add(sun);
  const obj = gltf.scene.clone(true);
  obj.rotation.z = THREE.MathUtils.degToRad(s.roll);
  scene.add(obj);
  const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3());
  obj.position.sub(c);
  const r = Math.max(size.x, size.y, size.z) * 0.62;
  const cam = new THREE.OrthographicCamera(-r, r, r * s.h / s.w, -r * s.h / s.w, -100, 100);
  const yaw = THREE.MathUtils.degToRad(s.yaw), pitch = THREE.MathUtils.degToRad(s.pitch);
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * 10, Math.sin(pitch) * 10, Math.cos(yaw) * Math.cos(pitch) * 10);
  cam.lookAt(0, 0, 0);
  renderer.setSize(s.w, s.h); renderer.setClearColor(0x000000, 0);
  renderer.render(scene, cam);
  const blob = await new Promise((ok) => renderer.domElement.toBlob(ok, 'image/webp', 0.9));
  await fetch(`/save?file=${s.name}.webp`, { method: 'POST', body: blob });
  const im = new Image(); im.src = URL.createObjectURL(blob); document.getElementById('out').appendChild(im);
}
log('done');
</script></body></html>
