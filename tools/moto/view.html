<!doctype html>
<html><head><meta charset="utf-8"><title>Moto models</title>
<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }</script>
<style>body{margin:0;background:#cfe6f5;font:13px system-ui}#g{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px}figure{margin:0;background:#fff;border-radius:8px;padding:4px}img{width:100%;display:block}figcaption{font-size:11px;word-break:break-word}</style>
</head><body><div id="g"></div>
<script type="module">
// Shows models from a side or top view with their size, animations and node names, to plan the sprites.
// ?list=models/bike_a.glb,kenney/car-kit/Models/GLB format/taxi.glb   ?view=top
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const P = new URLSearchParams(location.search);
const list = (P.get('list') || '').split(',').filter(Boolean);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true }); r.setSize(300, 300); r.outputColorSpace = THREE.SRGBColorSpace;
const loader = new GLTFLoader();
const g = document.getElementById('g');
window.info = {};
for (const path of list) {
  const gl = await loader.loadAsync('/' + path);
  const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 1.6); d.position.set(3, 5, 4); scene.add(d);
  scene.add(gl.scene);
  const box = new THREE.Box3().setFromObject(gl.scene), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const m = Math.max(size.x, size.y, size.z) * 0.62;
  const cam = new THREE.OrthographicCamera(-m, m, m, -m, -100, 100);
  if (P.get('view') === 'top') { cam.position.set(c.x, c.y + 10, c.z); cam.up.set(0, 0, -1); } else cam.position.set(c.x + 1, c.y + 0.25, c.z + 0.6);
  cam.lookAt(c);
  r.render(scene, cam);
  const anims = gl.animations.map((a) => a.name);
  const name = path.split('/').pop();
  window.info[name] = { size: size.toArray().map((v) => +v.toFixed(2)), min: box.min.toArray().map((v) => +v.toFixed(2)), anims };
  g.insertAdjacentHTML('beforeend', `<figure><img src="${r.domElement.toDataURL()}"><figcaption><b>${name}</b> ${size.toArray().map((v) => v.toFixed(2)).join('×')}<br>${anims.join(', ')}</figcaption></figure>`);
}
window.done = true;
</script></body></html>
